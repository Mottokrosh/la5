---
title: Contact
bodyClass: contact-form
---
<h2>Contact us</h2>

<form name="contact" method="POST" action="/thank-you/" data-netlify="true" netlify-honeypot="url" data-netlify-recaptcha="true">
  <label for="contact-name">Your Name:</label><input id="contact-name" type="text" name="name" required>

  <label for="contact-email">Your Email:</label><input id="contact-email" type="email" name="email" required>

  <span hidden><label>Your URL:</label><input type="url" name="url" tabindex="-1" autocomplete="off"></span>

  <label for="contact-message">Message:</label><textarea id="contact-message" name="message" required></textarea>

  <div></div>
  <div data-netlify-recaptcha="true"></div>

  <div></div>
  <div>
    <button type="submit">
      {% icon "mail" %}
      <span>Send</span>
    </button>
  </div>
</form>
