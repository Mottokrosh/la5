[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "24"

# `npm start` runs Eleventy behind Netlify Dev, which applies _redirects and serves functions
[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 8080
  port = 8888
  publish = "_site"
